<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>Mất kết nối mạng</title>
  <!-- Service worker trả trang này khi mở app / tải lại trang mà không có mạng (public/sw.js). -->
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f5; --card: #fff; --fg: #171717; --muted: #737373; --line: #e5e5e5; --btn: #171717; --btn-fg: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0a0a0a; --card: #171717; --fg: #f5f5f5; --muted: #a3a3a3; --line: #262626; --btn: #f5f5f5; --btn-fg: #171717; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
    .icon { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 16px; display: block; }
    .fallback { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 16px; background: #171717; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 34px; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
    ul { margin: 16px 0 0; padding: 0; list-style: none; text-align: left; font-size: 14px; color: var(--muted); }
    li { padding: 6px 0; border-top: 1px solid var(--line); }
    button { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--btn); color: var(--btn-fg); font-size: 16px; font-weight: 600; cursor: pointer; }
    .waiting { margin-top: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/icons/192" alt="" onerror="this.outerHTML='<div class=&quot;fallback&quot; aria-hidden=&quot;true&quot;>📶</div>'">
    <h1>Mất kết nối mạng</h1>
    <p>Không mở được app vì điện thoại đang không có mạng.</p>
    <ul>
      <li>Kiểm tra Wi-Fi quán hoặc bật 4G</li>
      <li>Tắt rồi bật lại chế độ máy bay</li>
      <li>Chấm công / checklist chỉ ghi nhận khi có mạng</li>
    </ul>
    <button type="button" onclick="location.reload()">Thử lại</button>
    <p class="waiting">Trang sẽ tự mở lại khi có mạng.</p>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
